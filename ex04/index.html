<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The CSS Box Model - ex04</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>The CSS Box Model Calculation</h1>

    <div class="box-container">
  
        <div class="box content-box">
            <h2>content-box</h2>
            <p>Declared width: 300px</p>
            <p>Padding: 20px | Border: 10px</p>
            <p><strong>Actual Total Width = 360px</strong></p>
        </div>

   
        <div class="box border-box">
            <h2>border-box</h2>
            <p>Declared width: 300px</p>
            <p>Padding: 20px | Border: 10px</p>
            <p><strong>Actual Total Width = 300px</strong></p>
        </div>
    </div>

</body>
</html>
